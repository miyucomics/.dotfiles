theme = "catppuccin_mocha"

[editor]
line-number = "relative"
mouse = false

[editor.lsp]
display-inlay-hints = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

[keys.normal]
C-s = ":w"
C-h = "jump_view_left"
C-l = "jump_view_right"
C-j = "jump_view_up"
C-k = "jump_view_down"

[keys.normal.space]
n = ":toggle line-number absolute relative"

[keys.insert]
"C-backspace" = "delete_word_backward"
