defaults:
  view: issues
  preview:
    width: 0.3
  layout:
    issues:
      creator:
        width: 30
    prs:
      author:
        width: 30

prSections:
  - title: My Repos
    filters: is:open user:@me
  - title: Awaiting My Review
    filters: is:open review-requested:@me

issuesSections:
  - title: My Repos
    filters: is:open user:@me
  - title: Assigned For Me
    filters: is:open assignee:@me

keybindings:
  universal:
    - key: y
      builtin: copyurl
    - key: Y
      builtin: copyNumber
    - key: J
      builtin: pageDown
    - key: K
      builtin: pageUp
    - key: PageUp
      builtin: firstLine
    - key: PageDown
      builtin: lastLine
  prs:
    - key: H
      builtin: prevSidebarTab
    - key: L
      builtin: nextSidebarTab

theme:
  ui:
    table:
      compact: true
  colors:
    text:
      primary: "#cdd6f4"
      secondary: "#a6e3a1"
      inverted: "#11111b"
      faint: "#bac2de"
      warning: "#f9e2af"
      success: "#a6e3a1"
      error: "#f38ba8"
    background:
      selected: "#313244"
    border:
      primary: "#a6e3a1"
      secondary: "#45475a"
      faint: "#313244"

showAuthorIcons: false
