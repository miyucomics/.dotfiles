[mgr]
ratio = [1, 3, 2]
sort_by = "natural"
show_hidden = true

[preview]
tab_size = 4

[opener]
aseprite = [{ run = 'aseprite %s', orphan = true }]
inkscape = [{ run = 'inkscape %s', orphan = true }]
mpv = [{ run = 'mpv %s', orphan = true }]
nvim = [{ run = 'nvim %s', block = true }]
paplay = [{ run = 'paplay %s', orphan = true }]
awww = [{ run = 'awww img %s -tcenter', orphan = true }]
awww_pixel = [{ desc = "awww pixel", run = 'awww img %s -tcenter -fNearest', orphan = true }]
sioyek = [{ run = 'sioyek %s', orphan = true }]
unzip = [{ run = 'unzip %s -x __M*' }]
untar = [{ run = 'tar xzf %s' }]
zen = [{ run = 'zen-browser %s', orphan = true }]

[open]
rules = [
    {mime = "application/pdf", use = ["sioyek"]},
    {mime = "application/zip", use = ["unzip"]},

    {mime = "audio/*", use = ["paplay"]},
    {mime = "image/*", use = ["aseprite", "awww", "awww_pixel", "zen"]},
    {mime = "video/*", use = ["mpv"]},

    {url = "*.epub", use = ["sioyek"]},
    {url = "*.svg", use = ["inkscape", "zen"]},
    {url = "*.html", use = ["zen", "nvim"]},
    {url = "*/", use = ["nvim"]},
    {url = "*", use = ["nvim"]}
]
